<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Virtual Tour Museum</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
<!-- Tombol Fullscreen -->
<button id="btn-fullscreen">⛶</button>
  <!-- Pesan rotasi layar -->
<div id="rotate-screen">
  <div id="rotate-box">
    <div id="rotate-icon"> <img width="80px" src="Foto/rotate (1).png" alt=""></div>
    <p>Putar perangkat Anda ke mode <strong>Landscape</strong> untuk pengalaman terbaik</p>
  </div>
</div>

  <canvas id="canvas"></canvas>

  <!-- Loading Screen -->
  <div id="loading-screen">
  <div class="loader-box">
    <p id="progress-text">Memuat Museum...</p>
    <div class="progress-bar"><div id="progress"></div></div>
  </div>
</div>

  <!-- Overlay fade transisi -->
<div id="fade-overlay"></div>

<!-- Tombol lantai -->
<div id="floor-controls">
  
  <button id="btn-lantai7" class="btn-lantai">L7</button>
  <button id="btn-lantai6" class="btn-lantai">L6</button>
  <button id="btn-lantai5" class="btn-lantai">L5</button>
  <button id="btn-lantai4" class="btn-lantai">L4</button>
  <button id="btn-lantai3" class="btn-lantai">L3</button>
  <button id="btn-lantai2" class="btn-lantai">L2</button>
  <button id="btn-lantai1" class="btn-lantai">L1</button>
</div>
<!-- Tombol Kembali -->
<button id="btn-back" onclick="history.back()">Kembali</button>

<!-- Panel Info Objek -->
<div id="info-panel">
  <div id="panel-konten">
    <button id="panel-tutup">✕</button>
    <h2 id="panel-nama"></h2>
    <p><strong>Tahun:</strong> <span id="panel-tahun"></span></p>
    <p><strong>Asal:</strong> <span id="panel-asal"></span></p>
    <hr>
    <p id="panel-deskripsi"></p>
  </div>
</div>

<!-- Tombol arah mobile -->
<div id="mobile-controls">
  <div id="btn-row-top">
    <button id="btn-maju">▲</button>
  </div>
  <div id="btn-row-mid">
    <button id="btn-kiri">◀</button>
    <button id="btn-mundur">▼</button>
    <button id="btn-kanan">▶</button>
  </div>
</div>

<!-- Crosshair -->
<div id="crosshair">+</div>

<!-- Tooltip -->
<div id="tooltip"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="VirtualTour.js"></script>

  
</body>
</html>
